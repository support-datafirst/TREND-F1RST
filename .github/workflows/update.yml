name: update trends
on:
  schedule:
    - cron: '7,37 * * * *' # off the :00/:30 peak, where GitHub delays or drops scheduled runs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ponytail: commits trends.json every run (~48/day). Switch to actions/deploy-pages if repo history gets heavy.
      - run: node fetch.js --check && node fetch.js
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add trends.json
          git diff --cached --quiet || (git commit -m "update trends" && git push)
