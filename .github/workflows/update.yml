name: build site.json
on:
  workflow_dispatch:
  push: # someone changed the YouTube link or slides: rebuild site.json. Live data comes from Apps Script, no schedule needed.
    branches: [main]
    paths: ['config.json', 'slides/**', 'site.js']
concurrency: build-site
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node site.js --check && node site.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add site.json
          git diff --cached --quiet || (git commit -m "update site.json" && git pull --rebase && git push)
