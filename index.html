<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TREND F1RST</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<!-- Plain ES5 + prefixed flexbox on purpose: Samsung/LG TV browsers run old engines (no CSS grid, no arrow functions). -->
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #07090d; color: #f3f4f6; font-family: 'Noto Sans Thai', Tahoma, sans-serif; cursor: none; }
#bar { height: 5vh; padding: 0 1.4vw; font-size: 2.1vh; color: #7d8596; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; }
#bar b { color: #f3f4f6; letter-spacing: .06em; }
#bar .one { color: #38bdf8; }
#updated.stale { color: #ff6b6b; }
/* Left 2 of 5 columns: YouTube (2 rows), weather (1 row), slides (2 rows). Right 3 columns: trends. */
#side { position: absolute; top: 5vh; left: 0; bottom: 0; width: 40%; padding: 0 0 .8vw .8vw; }
.slot { padding: .4vw; }
.box { position: relative; height: 100%; overflow: hidden; border-radius: .6vw; background: #131722; }
#yt, #sl { height: 40%; }
#wx { height: 20%; }
/* 16:9 player as wide as the box and centred, so the video covers it (top/bottom trimmed) instead of showing side bars. */
#ytBox .fill { position: absolute; left: 0; right: 0; top: 50%; padding-top: 56.25%; -webkit-transform: translateY(-50%); transform: translateY(-50%); }
#ytBox iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
.empty { position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 2vh; color: #7d8596; font-size: 2vh; text-align: center; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
#slide { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #000; background-position: center; background-repeat: no-repeat; background-size: cover; -webkit-transition: opacity .8s; transition: opacity .8s; }
#slide.out { opacity: 0; }
#wx .box { display: -webkit-flex; display: flex; }
.wx { -webkit-flex: 1; flex: 1; min-width: 0; padding: 1.2vh 1vw; border-left: 1px solid #222838; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; }
.wx:first-child { border-left: 0; }
.wx .k { font-size: 1.6vh; font-weight: 700; color: #7d8596; }
.wx .v { font-size: 5.4vh; font-weight: 700; line-height: 1.25; }
.wx.rain { -webkit-flex: 2; flex: 2; -webkit-justify-content: flex-start; justify-content: flex-start; }
/* Step chart like Google's "โอกาสฝนตก": one bar per hour (next 6 h), each labelled with % and time. */
.bars { -webkit-flex: 1; flex: 1; margin: 3.4vh 0 2.2vh; display: -webkit-flex; display: flex; }
.bar { -webkit-flex: 1; flex: 1; position: relative; }
.bar i { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(91,155,255,.18); border-top: .35vh solid #5b9bff; }
.bar b, .bar em { position: absolute; left: 50%; width: 6em; margin-left: -3em; text-align: center; font-style: normal; white-space: nowrap; }
.bar b { margin-bottom: .6vh; font-size: 1.6vh; color: #5b9bff; }
.bar em { top: 100%; margin-top: .5vh; font-size: 1.4vh; color: #7d8596; }
.wx .s { font-size: 1.5vh; line-height: 1.4; color: #aab1bf; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
#grid { position: absolute; top: 5vh; left: 40%; right: 0; bottom: 0; padding: 0 .8vw .8vw 0; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
.cell { padding: .4vw; -webkit-transition: opacity .7s, -webkit-transform .7s; transition: opacity .7s, transform .7s; }
.cell.out { opacity: 0; -webkit-transform: scale(.95); transform: scale(.95); }
.card { position: relative; height: 100%; overflow: hidden; border-radius: .6vw; border-top: .5vh solid #333; background-color: #131722; background-position: center; background-size: cover; padding: 1em 1.2em; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.top, .sub, .metric { -webkit-flex-shrink: 0; flex-shrink: 0; }
.top { font-size: 1.45em; line-height: 1.3; font-weight: 700; letter-spacing: .03em; margin-bottom: .5em; display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; }
.rank { color: #fff; opacity: .45; }
.title { font-weight: 700; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; }
.sub { margin-top: .35em; font-size: 1.4em; line-height: 1.35; color: #aab1bf; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }
.metric { margin-top: auto; padding-top: .3em; font-size: 1.6em; line-height: 1.3; font-weight: 700; }
</style>
</head>
<body>
<div id="bar"><span><b>TREND F<span class="one">1</span>RST</b> &nbsp;เทรนด์ตอนนี้</span><span><span id="updated"></span> &nbsp; <b id="clock"></b></span></div>
<div id="side">
  <div id="yt" class="slot"><div class="box" id="ytBox"></div></div>
  <div id="wx" class="slot"><div class="box">
    <div class="wx"><div class="k">อุณหภูมิ</div><div class="v" id="wxTemp">–</div><div class="s" id="wxSky"></div></div>
    <div class="wx rain"><div class="k" id="wxRainK">โอกาสฝนตก</div><div class="bars" id="wxBars"></div></div>
    <div class="wx"><div class="k">ฝุ่น PM2.5</div><div class="v" id="wxPm">–</div><div class="s" id="wxPmS"></div></div>
  </div></div>
  <div id="sl" class="slot"><div class="box"><div id="slide"></div><div class="empty" id="slEmpty">อัปโหลดรูป 16:9 ไว้ในโฟลเดอร์ slides/ บน GitHub</div></div></div>
</div>
<div id="grid"></div>
<script>
(function () {
  // ?rows=5&cols=3&speed=5&swap=3 (every `speed` seconds, `swap` cards change at once), same idea as trends.google.com/tv
  var q = {};
  location.search.replace(/[?&](\w+)=(\d+)/g, function (_, k, v) { q[k] = +v; });
  var ROWS = q.rows || 5, COLS = q.cols || 3, SWAP_MS = (q.speed || 5) * 1000, PER_TICK = q.swap || 3;
  var PLATFORMS = {
    google: ['Google', '#5b9bff'], x: ['X', '#f5f5f5'], youtube: ['YouTube', '#ff4040'], ytnews: ['YouTube ข่าว', '#ff4040'],
    pantip: ['Pantip', '#a78bfa'],
    wiki: ['Wikipedia', '#3cc9b4'], apple: ['Apple Music', '#ff5c8a'], hn: ['Hacker News', '#ff8a3d']
  };

  var grid = document.getElementById('grid'), cells = [], order = [], items = [], raw = '', updated = '', next = 0, turn = 0, i;
  var ytSrc = null, slides = [], slideAt = 0, slideMs = 10000, shown = '';
  grid.style.fontSize = Math.min(5 / ROWS, 5 / COLS) + 'vh';
  for (i = 0; i < ROWS * COLS; i++) {
    var c = document.createElement('div');
    c.className = 'cell';
    c.style.width = 100 / COLS + '%';
    c.style.height = 100 / ROWS + '%';
    c.innerHTML = '<div class="card"><div class="top"><span class="src"></span><span class="rank"></span></div>' +
      '<div class="title"></div><div class="sub"></div><div class="metric"></div></div>';
    grid.appendChild(c);
    cells.push(c);
    order.push(i);
  }
  // Cells are replaced in one fixed shuffled order, so the screen always shows the latest N items of the
  // list, which fetch.js already mixed 3 TH : 1 intl. That keeps the 75/25 ratio on screen at all times.
  for (i = order.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = order[i];
    order[i] = order[j]; order[j] = t;
  }

  function fill(cell, it) {
    var p = PLATFORMS[it.source] || [it.source, '#888'], card = cell.firstChild;
    cell.it = it;
    card.style.borderTopColor = p[1];
    card.style.backgroundImage = it.img
      ? 'linear-gradient(rgba(19,23,34,.7), rgba(19,23,34,.94)), url("' + it.img.replace(/"/g, '%22') + '")' : 'none';
    card.querySelector('.src').style.color = p[1];
    card.querySelector('.src').textContent = p[0] + ' · ' + it.region;
    card.querySelector('.rank').textContent = '#' + it.rank;
    var sub = card.querySelector('.sub');
    sub.textContent = it.sub || '';
    sub.style.display = '';
    card.querySelector('.metric').style.color = p[1];
    card.querySelector('.metric').textContent = it.metric || '';
    fit(card.querySelector('.title'), it.title, sub);
  }

  // Shrink the title until it fits the space left in the card (no half-cut lines, no hashtag overflowing sideways).
  // Compared in lines, not pixels: Thai glyphs poke above the line box (how far depends on the font), so scrollHeight
  // runs a bit over; up to 3/4 of a line of that is tolerated. Still cut at the smallest size: drop the sub line and retry.
  function fit(el, text, sub) {
    var size = text.length <= 12 ? 3.6 : text.length <= 24 ? 3 : 2.6, lh, room, cut;
    el.textContent = text;
    el.style.webkitLineClamp = 'none';
    el.style.wordWrap = 'normal';
    do {
      el.style.fontSize = size + 'em';
      lh = parseFloat(getComputedStyle(el).fontSize) * 1.35;
      room = Math.floor(el.clientHeight / lh + 0.1);
      cut = Math.floor(el.scrollHeight / lh + 0.25) > room || el.scrollWidth > el.clientWidth + 1;
      size -= 0.2;
    } while (cut && size > 1.79);
    if (cut && sub.textContent && sub.style.display !== 'none') {
      sub.style.display = 'none';
      return fit(el, text, sub);
    }
    el.style.wordWrap = 'break-word';
    el.style.webkitLineClamp = Math.max(1, room);
  }

  function swap() {
    if (!items.length) return;
    var cell = cells[order[turn++ % cells.length]], it = items[next++ % items.length];
    cell.className = 'cell out';
    setTimeout(function () { fill(cell, it); cell.className = 'cell'; }, 700);
  }

  function $(id) { return document.getElementById(id); }

  // Left column: YouTube, weather/PM2.5, slides. All come from trends.json (fetch.js copies them from config.json).
  function side(d) {
    if (d.youtube !== ytSrc) { // reload the player only when the link changes, not on every refresh
      ytSrc = d.youtube;
      $('ytBox').innerHTML = ytSrc ? '<div class="fill"></div>' : '<div class="empty">ใส่ลิงก์ YouTube ใน config.json บน GitHub</div>';
      if (ytSrc) {
        var f = document.createElement('iframe');
        f.src = ytSrc;
        f.setAttribute('allow', 'autoplay; encrypted-media');
        $('ytBox').firstChild.appendChild(f);
      }
    }
    var w = d.weather, a = d.air;
    if (w) {
      $('wxTemp').textContent = w.temp + '°';
      $('wxSky').textContent = w.sky + ' · รู้สึกเหมือน ' + w.feels + '°';
      var hrs = (w.rain && w.rain.hours) || [], bars = '';
      for (var k = 0; k < hrs.length; k++) {
        var pc = +hrs[k].p || 0;
        bars += '<div class="bar"><i style="height:' + pc + '%"></i>' +
          '<b style="bottom:' + pc + '%">' + pc + '%</b><em>' + hrs[k].t + '</em></div>';
      }
      $('wxBars').innerHTML = bars;
      $('wxRainK').textContent = 'โอกาสฝนตก' + (w.rain && w.rain.now ? ' · ตอนนี้ฝนตกอยู่' : '');
    }
    if (a) {
      $('wxPm').textContent = a.pm25;
      $('wxPm').style.color = a.color;
      $('wxPmS').textContent = a.label + ' · ' + a.station + ' ' + a.time;
    }
    slides = d.slides || [];
    slideMs = (d.slideSeconds || 10) * 1000;
    $('slEmpty').style.display = slides.length ? 'none' : '';
    if (!slides.length) { $('slide').style.backgroundImage = 'none'; shown = ''; }
  }

  function nextSlide() {
    if (slides.length) {
      var src = slides[slideAt++ % slides.length], el = $('slide');
      if (src !== shown) { // a single slide stays put instead of blinking
        shown = src;
        el.className = 'out';
        setTimeout(function () { el.style.backgroundImage = 'url("' + src + '")'; el.className = ''; }, 800);
        new Image().src = slides[slideAt % slides.length]; // preload the next one
      }
    }
    setTimeout(nextSlide, slideMs);
  }

  function pad(n) { return n < 10 ? '0' + n : n; }
  function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function load() {
    var x = new XMLHttpRequest();
    x.open('GET', 'trends.json?t=' + Date.now());
    x.onload = function () {
      var d;
      try { d = JSON.parse(x.responseText); } catch (e) { return; }
      if (!d.items || !d.items.length || x.responseText === raw) return;
      var first = !items.length;
      raw = x.responseText;
      items = d.items;
      updated = d.updated;
      side(d);
      if (first) {
        for (var k = 0; k < cells.length; k++) fill(cells[order[k]], items[k % items.length]);
        next = cells.length;
        nextSlide();
        // Titles measured before the web font arrived were sized for the fallback font: measure again once it is in.
        if (document.fonts) document.fonts.ready.then(function () {
          for (var k = 0; k < cells.length; k++) fill(cells[k], cells[k].it);
        });
      } else {
        next = 0; // new data: start again from the top-ranked items
      }
      tick();
    };
    x.send();
  }

  function tick() {
    var now = new Date(), el = document.getElementById('updated');
    document.getElementById('clock').textContent = hhmm(now);
    if (!updated) return;
    el.textContent = 'อัปเดต ' + hhmm(new Date(updated));
    el.className = now - new Date(updated) > 2 * 36e5 ? 'stale' : ''; // red = fetch job stopped
  }

  // ?debug=1 on the TV shows what its browser really does (viewport, forced minimum font sizes, title measurements).
  if (q.debug) setTimeout(function () {
    var d = document.createElement('div'), s = document.querySelector('.sub'), t = document.querySelector('.title');
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#000;color:#0f0;font:16px monospace;padding:8px;z-index:9';
    d.textContent = innerWidth + 'x' + innerHeight + ' @' + devicePixelRatio + ' | grid ' + getComputedStyle(grid).fontSize +
      ' sub ' + getComputedStyle(s).fontSize + ' title ' + getComputedStyle(t).fontSize + ' ' + t.clientHeight + '/' + t.scrollHeight +
      ' | ' + navigator.userAgent;
    document.body.appendChild(d);
  }, 5000);

  load();
  tick();
  setInterval(function () { for (var n = 0; n < PER_TICK; n++) swap(); }, SWAP_MS);
  setInterval(tick, 10000);
  setInterval(load, 10 * 60000);
  setTimeout(function () { location.reload(); }, 6 * 36e5); // TV browsers leak memory over days
})();
</script>
</body>
</html>
